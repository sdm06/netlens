[package]
name = "netlens"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Live packet lens: topology map and anomaly detection"
license = "MIT"
repository = "https://github.com/example/netlens"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.31"
egui_plot = "0.31"
pnet_datalink = "0.35.0"

[profile.release]
lto = "thin"
codegen-units = 1
